<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tests opmaak</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  li.goed { color: #1a7f37; } li.fout { color: #b3261e; font-weight: 600; }
  #som { font-size: 18px; font-weight: 700; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha512-8Q6Y9XnTbOE+JNvjBQwJ2H8S+UV4uA6hiRykhdtIyDYZ2TprdNmWOUaKdGzOhyr4dCyk287OejbPvwl7lrfqrQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha512-MOCpqoRoisCTwJ8vQQiciZv0qcpROCidek3GTFS6KTk2+y7munJIlKCVkFCYY+p3ErYFXCjmFjnfTTRSC1OHWQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<!-- Tests voor opmaak.js en de "?"-logica van de designsysteemcomponenten.
     Openen via een lokale server (bijv. http://localhost:8766/tests/opmaak.html).
     Alleen verzonnen voorbeeldwaarden, geen reisinhoud. -->
<p id="som">Bezig…</p>
<ul id="lijst"></ul>
<script src="../ds/bundle.js"></script>
<script src="../opmaak.js"></script>
<script>
(function () {
  var uitslag = [];
  function test(naam, verwacht, fn) {
    var werkelijk;
    try { werkelijk = fn(); } catch (e) { werkelijk = 'FOUT: ' + e.message; }
    var ok = JSON.stringify(verwacht) === JSON.stringify(werkelijk);
    uitslag.push({ naam: naam, ok: ok, verwacht: verwacht, werkelijk: werkelijk });
  }
  // Rendert een Reisgids-component en geeft de zichtbare tekst terug.
  function tekst(comp, props) {
    var div = document.createElement('div'), root = ReactDOM.createRoot(div);
    ReactDOM.flushSync(function () { root.render(React.createElement(window.Reisgids[comp], props)); });
    var t = div.textContent.replace(/\s+/g, ' ').trim();
    root.unmount();
    return t;
  }
  var O = window.Opmaak || {};

  // --- Datums (UTC, dus onafhankelijk van de tijdzone van het toestel) ---
  test('dagLabel: één dag', 'za 5 jan', function () { return O.dagLabel('2030-01-05'); });
  test('dagLabel: tot = van is één dag', 'za 5 jan', function () { return O.dagLabel('2030-01-05', '2030-01-05'); });
  test('dagLabel: periode in één maand', 'za 5 – ma 7 jan', function () { return O.dagLabel('2030-01-05', '2030-01-07'); });
  test('dagLabel: over de maandgrens', 'do 31 jan – za 2 feb', function () { return O.dagLabel('2030-01-31', '2030-02-02'); });
  test('dagLabel: over de jaargrens', 'di 31 dec – do 2 jan', function () { return O.dagLabel('2030-12-31', '2031-01-02'); });
  test('dagLabel: juni voluit', 'ma 10 juni', function () { return O.dagLabel('2030-06-10'); });
  test('dagLabel: juli voluit', 'ma 1 juli', function () { return O.dagLabel('2030-07-01'); });
  test('dagLabel: maart is mrt', 'vr 1 mrt', function () { return O.dagLabel('2030-03-01'); });
  test('dagLabel: schrikkeldag', 'zo 29 feb', function () { return O.dagLabel('2032-02-29'); });
  test('langeDatum', '1 maart', function () { return O.langeDatum('2030-03-01'); });
  test('kortDatum', '1 mrt', function () { return O.kortDatum('2030-03-01'); });
  test('kortDatum: juni afgekort', '10 jun', function () { return O.kortDatum('2030-06-10'); });

  // --- Bedragen en aantallen: onbekend is "?", nooit 0 ---
  test('euro: duizendtallen', '€ 1.500', function () { return O.euro(1500); });
  test('euro: afgerond op hele euro', '€ 1.235', function () { return O.euro(1234.5); });
  test('euro: nul blijft nul', '€ 0', function () { return O.euro(0); });
  test('prijsTekst: null is ?', '€ ?', function () { return O.prijsTekst(null); });
  test('prijsTekst: undefined is ?', '€ ?', function () { return O.prijsTekst(undefined); });
  test('prijsTekst: 0 is bekend', '€ 0', function () { return O.prijsTekst(0); });
  test('nachtenTekst: null', '? nachten', function () { return O.nachtenTekst(null); });
  test('nachtenTekst: 1', '1 nacht', function () { return O.nachtenTekst(1); });
  test('nachtenTekst: 0', '0 nachten', function () { return O.nachtenTekst(0); });
  test('nachtenTekst: 3', '3 nachten', function () { return O.nachtenTekst(3); });

  // --- Reistijd ---
  test('reistijd: null', '?', function () { return O.reistijd(null); });
  test('reistijd: null met benadering', '?', function () { return O.reistijd(null, true); });
  test('reistijd: minuten', '40 min', function () { return O.reistijd(40); });
  test('reistijd: 0', '0 min', function () { return O.reistijd(0); });
  test('reistijd: heel uur', '1u', function () { return O.reistijd(60); });
  test('reistijd: uur en minuten', '1u35', function () { return O.reistijd(95); });
  test('reistijd: minuten met voorloopnul', '1u05', function () { return O.reistijd(65); });
  test('reistijd: benadering', '~2u', function () { return O.reistijd(120, true); });
  test('reistijd: benadering in minuten', '~40 min', function () { return O.reistijd(40, true); });

  // --- Beoordeling en namen ---
  test('beoordelingTekst: heel getal krijgt ,0', '9,0 Booking.com', function () { return O.beoordelingTekst({ beoordeling: 9, beoordeling_bron: 'Booking.com' }); });
  test('beoordelingTekst: zonder bron', '8,4', function () { return O.beoordelingTekst({ beoordeling: 8.4 }); });
  test('beoordelingTekst: onbekend', undefined, function () { return O.beoordelingTekst({ beoordeling: null }); });
  test('kortNaam: haakjes weg', 'Dorp', function () { return O.kortNaam('Dorp (aan de rivier)'); });
  test('kortNaam: null', '?', function () { return O.kortNaam(null); });
  test('kortNaam: leeg', '?', function () { return O.kortNaam(''); });

  // --- Links en fotocredits ---
  test('veiligeLink: https', 'https://voorbeeld.test/a', function () { return O.veiligeLink('https://voorbeeld.test/a'); });
  test('veiligeLink: http', 'http://voorbeeld.test/', function () { return O.veiligeLink('http://voorbeeld.test/'); });
  test('veiligeLink: javascript geweigerd', undefined, function () { return O.veiligeLink('javascript:alert(1)'); });
  test('veiligeLink: hoofdletters JAVASCRIPT geweigerd', undefined, function () { return O.veiligeLink('JAVASCRIPT:alert(1)'); });
  test('veiligeLink: protocol-relatief geweigerd', undefined, function () { return O.veiligeLink('//voorbeeld.test'); });
  test('veiligeLink: null', undefined, function () { return O.veiligeLink(null); });
  test('licentieUrl: CC BY-SA 4.0', 'https://creativecommons.org/licenses/by-sa/4.0/', function () { return O.licentieUrl('CC BY-SA 4.0'); });
  test('licentieUrl: CC BY 2.5', 'https://creativecommons.org/licenses/by/2.5/', function () { return O.licentieUrl('CC BY 2.5'); });
  test('licentieUrl: CC0', 'https://creativecommons.org/publicdomain/zero/1.0/', function () { return O.licentieUrl('CC0'); });
  test('licentieUrl: eigen foto geen link', undefined, function () { return O.licentieUrl('Eigen foto'); });
  test('licentieUrl: leeg', undefined, function () { return O.licentieUrl(undefined); });
  test('fotoCredit: Commons', { tekst: 'Naam Fotograaf / Wikimedia Commons', href: 'https://commons.wikimedia.org/wiki/File:X.jpg', licentie: 'CC BY-SA 4.0', licentieHref: 'https://creativecommons.org/licenses/by-sa/4.0/' },
    function () { return O.fotoCredit({ fotograaf: 'Naam Fotograaf', bron: 'Wikimedia Commons, CC BY-SA 4.0', bron_url: 'https://commons.wikimedia.org/wiki/File:X.jpg' }); });
  test('fotoCredit: eigen foto zonder licentie', { tekst: 'Eigen foto' },
    function () { return O.fotoCredit({ fotograaf: null, bron: 'Eigen foto', bron_url: null }); });
  test('fotoCredit: onveilige bron-URL geen link', undefined,
    function () { return O.fotoCredit({ fotograaf: 'A', bron: 'Wikimedia Commons, CC0', bron_url: 'javascript:x' }).href; });

  // --- Kosten: budget_posten-rij → categorie (totaal leeg = ?, betaald leeg = € 0) ---
  test('budgetRegel: alles bekend', { label: 'Vluchten', total: 1200, paid: 300, detail: 'retour' },
    function () { return O.budgetRegel({ label: 'Vluchten', totaal: 1200, betaald: 300, detail: 'retour' }); });
  test('budgetRegel: totaal leeg blijft onbekend (null)', { label: 'Eten', total: null, paid: 0 },
    function () { return O.budgetRegel({ label: 'Eten', totaal: null, betaald: null, detail: null }); });
  test('budgetRegel: betaald leeg telt als 0', { label: 'Huur', total: 500, paid: 0 },
    function () { return O.budgetRegel({ label: 'Huur', totaal: 500, betaald: null }); });
  test('budgetRegel: 0 is bekend, niet onbekend', { label: 'Museum', total: 0, paid: 0 },
    function () { return O.budgetRegel({ label: 'Museum', totaal: 0, betaald: 0 }); });
  test('budgetRegel: getal als tekst wordt getal', { label: 'Auto', total: 350.5, paid: 100 },
    function () { return O.budgetRegel({ label: 'Auto', totaal: '350.5', betaald: '100' }); });

  // --- Kostenoverzicht (BudgetSummary) ---
  function bs(cats) { return tekst('BudgetSummary', { categories: cats }); }
  test('Kosten: alles bekend, niets betaald', true, function () {
    var t = bs([{ label: 'A', total: 600, paid: 0 }, { label: 'B', total: 400, paid: 0 }]);
    return t.indexOf('€ 1.000') > -1 && t.indexOf('€ 0 betaald · € 1.000 open') > -1;
  });
  test('Kosten: één totaal onbekend geeft "+ ?" en "rest ?"', true, function () {
    var t = bs([{ label: 'A', total: 600, paid: 100 }, { label: 'B', total: null, paid: 0 }]);
    return t.indexOf('€ 600 + ?') > -1 && t.indexOf('€ 100 betaald · rest ?') > -1 && t.indexOf('B€ ?') > -1;
  });
  test('Kosten: alle totalen onbekend is "€ ?"', true, function () {
    var t = bs([{ label: 'A', total: null, paid: 0 }]);
    return /Totaal€ \?/.test(t) && t.indexOf('rest ?') > -1;
  });
  test('Kosten: volledig betaald', true, function () {
    return bs([{ label: 'A', total: 500, paid: 500 }]).indexOf('Volledig betaald') > -1;
  });
  test('Kosten: onbekend totaal is nooit volledig betaald', false, function () {
    return bs([{ label: 'A', total: 500, paid: 500 }, { label: 'B', total: null, paid: 0 }]).indexOf('Volledig betaald') > -1;
  });

  // --- Verblijfkaart (StayCard): leeg is "?", false is "nee" ---
  test('Verblijf: onbekende kenmerken zijn ?', true, function () {
    var t = tekst('StayCard', { name: 'Hotel', place: 'Dorp' });
    return ['Ontbijt ?', 'Zwembad ?', 'Beoordeling ?', 'Kamers ?', '€ ?'].every(function (s) { return t.indexOf(s) > -1; });
  });
  test('Verblijf: false is nee, true is ja', true, function () {
    var t = tekst('StayCard', { name: 'Hotel', place: 'Dorp', breakfast: false, pool: true, rooms: 1, price: 90 });
    return ['Ontbijt nee', 'Zwembad ja', '1 kamer', '€ 90'].every(function (s) { return t.indexOf(s) > -1; });
  });

  // --- Rit, verblijf en excursie uit vaste velden (tijden zoals Postgres ze geeft: "22:10:00") ---
  test('tijd: seconden weg', '22:10', function () { return O.tijd('22:10:00'); });
  test('tijd: leeg is leeg', '', function () { return O.tijd(null); });
  test('ritTijden: vertrek en aankomst', '08:30 → 12:00', function () { return O.ritTijden({ leg_vertrek: '08:30:00', leg_aankomst: '12:00:00', leg_aankomst_dagen: 0 }); });
  test('ritTijden: aankomst de dag erna', '22:10 → 07:05 (+1 dag)', function () { return O.ritTijden({ leg_vertrek: '22:10:00', leg_aankomst: '07:05:00', leg_aankomst_dagen: 1 }); });
  test('ritTijden: alleen aankomst', 'aankomst 08:45', function () { return O.ritTijden({ leg_vertrek: null, leg_aankomst: '08:45:00', leg_aankomst_dagen: 0 }); });
  test('ritTijden: alleen vertrek', 'vertrek 22:10', function () { return O.ritTijden({ leg_vertrek: '22:10:00', leg_aankomst: null }); });
  test('ritTijden: met datum', 'di 15 jan, 22:10 → 07:05 (+1 dag)', function () { return O.ritTijden({ leg_datum: '2030-01-15', leg_vertrek: '22:10:00', leg_aankomst: '07:05:00', leg_aankomst_dagen: 1 }); });
  test('ritTijden: niets bekend is leeg', '', function () { return O.ritTijden({}); });
  test('tijdvak: begin en eind', '13:00–18:00', function () { return O.tijdvak('13:00:00', '18:00:00'); });
  test('tijdvak: alleen begin', 'vanaf 13:00', function () { return O.tijdvak('13:00:00', null); });
  test('tijdvak: niets', '', function () { return O.tijdvak(null, null); });
  test('activiteitWanneer: datum en tijden', 'do 17 jan, 13:00–18:00', function () { return O.activiteitWanneer({ datum: '2030-01-17', begin_tijd: '13:00:00', eind_tijd: '18:00:00' }); });
  test('activiteitWanneer: alleen datum', 'za 19 jan', function () { return O.activiteitWanneer({ datum: '2030-01-19' }); });
  test('activiteitWanneer: geen datum, wel tekst', 'ergens in jan', function () { return O.activiteitWanneer({ wanneer: 'ergens in jan' }); });
  test('activiteitWanneer: niets is ?', 'Wanneer ?', function () { return O.activiteitWanneer({}); });
  test('verblijfPeriode: in en uit', 'wo 16 – za 19 jan', function () { return O.verblijfPeriode({ inchecken: '2030-01-16', uitchecken: '2030-01-19' }); });
  test('verblijfPeriode: onbekend is leeg', '', function () { return O.verblijfPeriode({ inchecken: null }); });
  test('telLink: spaties weg, plus blijft', 'tel:+31201234567', function () { return O.telLink('+31 20 123 45 67'); });
  test('ritTijden: twee dagen later is meervoud', '22:00 → 06:00 (+2 dagen)', function () { return O.ritTijden({ leg_vertrek: '22:00:00', leg_aankomst: '06:00:00', leg_aankomst_dagen: 2 }); });
  test('telLink: (0) na landcode valt weg', 'tel:+31201234567', function () { return O.telLink('+31 (0)20 123 45 67'); });
  test('telLink: zonder cijfers geen link', undefined, function () { return O.telLink('zie mail'); });
  test('telLink: leeg is undefined', undefined, function () { return O.telLink(''); });
  // Lege status = onbekend (lege cel in de Excel): "Status ?", niet het standaardlabel van de badge.
  test('statusLabel: lege status is "Status ?"', 'Status ?', function () { return O.statusLabel({ status: null }); });
  test('statusLabel: status zonder eigen label → standaardlabel', undefined, function () { return O.statusLabel({ status: 'geboekt' }); });
  // Blok Slapen in het plek-paneel: geboekt, betaald én onbekend (lege status; besluit gebruiker
  // 2026-10-01: liever zichtbaar dan onderweg het adres missen). Optie/voorstel/open niet.
  test('inSlapen: geboekt, betaald en onbekend wel; optie, voorstel en open niet', [true, true, true, false, false, false], function () {
    return ['geboekt', 'betaald', null, 'optie', 'voorstel', 'open'].map(function (s) { return O.inSlapen({ status: s }); });
  });
  test('statusLabel: eigen label gaat voor', 'Nog betalen', function () { return O.statusLabel({ status: 'geboekt', status_label: 'Nog betalen' }); });

  // Feiten van een reis (besluit gebruiker 2026-10-02): periode uit de reisdatums, route-km opgeteld
  // uit de autoritten, gereden km (achteraf van de teller) apart. Verzonnen waarden.
  test('periodeKort: over twee maanden', '13 jul – 5 aug', function () { return O.periodeKort('2030-07-13', '2030-08-05'); });
  test('periodeKort: binnen één maand', '7 – 30 jul', function () { return O.periodeKort('2030-07-07', '2030-07-30'); });
  test('routeKm: som van de autoritten, andere ritten tellen niet', 650, function () {
    return O.routeKm([{ leg_vervoer: 'car', leg_km: 400 }, { leg_vervoer: 'plane', leg_km: 900 }, { leg_vervoer: 'car', leg_km: 250 }, { leg_vervoer: null, leg_km: null }]);
  });
  test('routeKm: een autorit zonder km → onbekend (null), nooit te laag', null, function () {
    return O.routeKm([{ leg_vervoer: 'car', leg_km: 400 }, { leg_vervoer: 'car', leg_km: null }]);
  });
  test('routeKm: geen autoritten → undefined', undefined, function () { return O.routeKm([{ leg_vervoer: 'plane', leg_km: 900 }]); });
  var auto = [{ leg_vervoer: 'car', leg_km: 1200 }, { leg_vervoer: 'car', leg_km: 800 }];
  test('reisFeiten: periode uit de datums vervangt de kalendertekst', [['calendar', '13 jul – 5 aug'], ['sun', 'warm']], function () {
    return O.reisFeiten({ start_datum: '2030-07-13', eind_datum: '2030-08-05', feiten: [['calendar', '~3 weken'], ['sun', 'warm']] }, []);
  });
  test('reisFeiten: zonder kalenderfeit maar met datums komt de periode vooraan', [['calendar', '7 – 30 jul'], ['plane', 'retour']], function () {
    return O.reisFeiten({ start_datum: '2030-07-07', eind_datum: '2030-07-30', feiten: [['plane', 'retour']] }, []);
  });
  test('reisFeiten: zonder datums blijft de kalendertekst', [['calendar', '~3 weken']], function () {
    return O.reisFeiten({ feiten: [['calendar', '~3 weken']] }, []);
  });
  test('reisFeiten: auto krijgt route-km', [['car', 'roadtrip · 2.000 km route']], function () {
    return O.reisFeiten({ feiten: [['car', 'roadtrip']] }, auto);
  });
  test('reisFeiten: auto met gereden km', [['car', 'roadtrip · 2.000 km route · 2.345 km gereden']], function () {
    return O.reisFeiten({ feiten: [['car', 'roadtrip']], km_gereden: 2345 }, auto);
  });
  test('reisFeiten: onbekende route-km → "? km route"', [['car', 'roadtrip · ? km route']], function () {
    return O.reisFeiten({ feiten: [['car', 'roadtrip']] }, [{ leg_vervoer: 'car', leg_km: null }]);
  });
  test('reisFeiten: gereden km ook zonder autoritten in de route', [['car', 'roadtrip · 2.345 km gereden']], function () {
    return O.reisFeiten({ feiten: [['car', 'roadtrip']], km_gereden: 2345 }, []);
  });
  test('periodeKort: zelfde maand in een ander jaar', '5 jan 2030 – 10 jan 2031', function () { return O.periodeKort('2030-01-05', '2031-01-10'); });
  test('reisFeiten: geen feiten en geen datums → lege lijst', [], function () { return O.reisFeiten({}, []); });

  // Vervoersopties bij een rit waarvan het vervoer nog niet gekozen is (leg_opties).
  var trein = { vervoer: 'train', label: 'Trein', minuten: 195 }, bus = { vervoer: 'bus', label: 'Bus', minuten: 240 };
  test('vervoerOpties: geen opties → lege lijst', [], function () { return O.vervoerOpties({ leg_vervoer: null, leg_opties: null }); });
  test('vervoerOpties: vervoer gekozen → geen opties', [], function () { return O.vervoerOpties({ leg_vervoer: 'train', leg_opties: [trein, bus] }); });
  test('vervoerOpties: geen lijst → lege lijst', [], function () { return O.vervoerOpties({ leg_vervoer: null, leg_opties: { vervoer: 'bus' } }); });
  test('vervoerOpties: onbekend vervoer valt weg', [trein], function () {
    return O.vervoerOpties({ leg_vervoer: null, leg_opties: [trein, { vervoer: 'raket', label: 'Raket' }, null] });
  });
  test('vervoerOpties: volgorde blijft', [bus, trein], function () { return O.vervoerOpties({ leg_vervoer: null, leg_opties: [bus, trein] }); });
  test('reistijdBereik: geen opties → "?"', '?', function () { return O.reistijdBereik([]); });
  test('reistijdBereik: één optie', '~3u15', function () { return O.reistijdBereik([trein]); });
  test('reistijdBereik: kortste–langste', '~3u15–4u', function () { return O.reistijdBereik([bus, trein]); });
  test('reistijdBereik: gelijke tijden → één tijd', '~4u', function () { return O.reistijdBereik([bus, { vervoer: 'car', minuten: 240 }]); });
  test('reistijdBereik: optie zonder tijd telt niet mee', '~3u15', function () { return O.reistijdBereik([trein, { vervoer: 'car', minuten: null }]); });
  test('reistijdBereik: geen enkele tijd → "?"', '?', function () { return O.reistijdBereik([{ vervoer: 'car' }]); });
  // Rare waarden in leg_opties (handmatig ingevoerd): geen getal = onbekend, nooit "NaN" of "0".
  test('reistijdBereik: ongeldige tijd telt niet mee', '~3u15', function () { return O.reistijdBereik([trein, { vervoer: 'bus', minuten: 'abc' }, { vervoer: 'car', minuten: '' }]); });
  test('optieTekst: ongeldige tijd en prijs', 'Bus · ? ', function () { return O.optieTekst({ vervoer: 'bus', minuten: 'abc', prijs: '' }) + ' '; });
  test('optieTekst: label geen tekst → naam van het vervoer', 'Trein · ~1u', function () { return O.optieTekst({ vervoer: 'train', label: { nl: 'x' }, minuten: 60 }); });
  test('optieTekst: tijd als tekst', 'Trein · ~3u15', function () { return O.optieTekst({ vervoer: 'train', minuten: '195' }); });
  test('optieTekst: kommagetal wordt afgerond', 'Trein · ~3u16', function () { return O.optieTekst({ vervoer: 'train', minuten: 195.5 }); });
  // Eén optie = advies, meer = keuze (besluit gebruiker 2026-10-04).
  test('optiesKop: één optie → advies', 'advies', function () { return O.optiesKop([trein]); });
  test('optiesKop: meer opties → nog te kiezen', 'nog te kiezen', function () { return O.optiesKop([trein, bus]); });
  // Prijs bij een optie is een indicatie (totaal reisgezelschap); geen prijs → weglaten, geen "€ ?".
  test('optieTekst: naam, tijd en prijs', 'Trein · ~3u15 · ~€ 240', function () { return O.optieTekst({ vervoer: 'train', label: 'Trein', minuten: 195, prijs: 240 }); });
  test('optieTekst: zonder prijs', 'Huurauto · ~3u', function () { return O.optieTekst({ vervoer: 'car', label: 'Huurauto', minuten: 180, prijs: null }); });
  test('optieTekst: zonder naam → naam van het vervoer', 'Bus · ~1u', function () { return O.optieTekst({ vervoer: 'bus', minuten: 60 }); });
  test('optieTekst: zonder tijd → "?"', 'Boot · ? · ~€ 1.250', function () { return O.optieTekst({ vervoer: 'boat', prijs: 1250 }); });

  // Hartjes per gezinslid (2026-10-04). Verzonnen namen en ID's.
  var leden = [{ user_id: 'u1', weergavenaam: 'Lies' }, { user_id: 'u2', weergavenaam: 'Bas' }, { user_id: 'u3', weergavenaam: null }];
  var hart = [{ user_id: 'u2', activiteit_id: 'a' }, { user_id: 'u1', activiteit_id: 'a' }, { user_id: 'u2', activiteit_id: 'b' }];
  var kern = function (x) { return { aantal: x.aantal, ikOok: x.ikOok, namen: x.namen }; };
  test('hartjesVan: geen hartjes', { aantal: 0, ikOok: false, namen: [] }, function () { return kern(O.hartjesVan([], 'a', leden, 'u1')); });
  test('hartjesVan: jij eerst, dan de anderen', { aantal: 2, ikOok: true, namen: ['Jij', 'Bas'] }, function () { return kern(O.hartjesVan(hart, 'a', leden, 'u1')); });
  test('hartjesVan: zonder naam → "Iemand"', { aantal: 1, ikOok: false, namen: ['Iemand'] }, function () {
    return kern(O.hartjesVan([{ user_id: 'u3', activiteit_id: 'c' }], 'c', leden, 'u1'));
  });
  test('hartjesVan: onbekend lid → "Iemand"', ['Iemand'], function () { return O.hartjesVan([{ user_id: 'u9', activiteit_id: 'c' }], 'c', leden, 'u1').namen; });
  test('hartjesVan: geen eigen ID → niemand is "Jij" (volgorde van geven)', ['Bas', 'Lies'], function () { return O.hartjesVan(hart, 'a', leden, null).namen; });
  test('hartjesTekst: leeg', '', function () { return O.hartjesTekst([]); });
  test('hartjesTekst: één', 'Jij', function () { return O.hartjesTekst(['Jij']); });
  test('hartjesTekst: twee', 'Jij en Bas', function () { return O.hartjesTekst(['Jij', 'Bas']); });
  test('hartjesTekst: drie', 'Jij, Bas en Lies', function () { return O.hartjesTekst(['Jij', 'Bas', 'Lies']); });
  // Vorm per groep (besluit gebruiker 2026-10-04): tiener en volwassene elk een eigen teken; onbekend = hart.
  var ledenG = [{ user_id: 'u1', weergavenaam: 'Lies', groep: 'volwassene' }, { user_id: 'u2', weergavenaam: 'Bas', groep: 'tiener' }];
  test('hartjesVan: gevers met groep, jij eerst', [{ naam: 'Jij', groep: 'volwassene' }, { naam: 'Bas', groep: 'tiener' }], function () {
    return O.hartjesVan(hart, 'a', ledenG, 'u1').gevers;
  });
  test('hartjesVan: groep onbekend → null', [{ naam: 'Iemand', groep: null }], function () {
    return O.hartjesVan([{ user_id: 'u9', activiteit_id: 'c' }], 'c', ledenG, 'u1').gevers;
  });
  test('hartVorm: tiener', '★', function () { return O.hartVorm('tiener'); });
  test('hartVorm: volwassene', '♥', function () { return O.hartVorm('volwassene'); });
  test('hartVorm: onbekend → hart', '♥', function () { return O.hartVorm(null); });
  test('activiteitWanneer: voorstel zonder datum → leeg (geen "Wanneer ?")', '', function () { return O.activiteitWanneer({ status: 'voorstel' }); });
  test('activiteitWanneer: voorstel met tekst', 'ergens in jan', function () { return O.activiteitWanneer({ status: 'voorstel', wanneer: 'ergens in jan' }); });

  // --- Uitslag tonen ---
  var goed = uitslag.filter(function (u) { return u.ok; }).length;
  document.getElementById('som').textContent = goed + ' / ' + uitslag.length + ' geslaagd' + (goed === uitslag.length ? ' ✓' : ' — ' + (uitslag.length - goed) + ' mislukt');
  var lijst = document.getElementById('lijst');
  uitslag.forEach(function (u) {
    var li = document.createElement('li');
    li.className = u.ok ? 'goed' : 'fout';
    li.textContent = (u.ok ? '✓ ' : '✗ ') + u.naam + (u.ok ? '' : ' — verwacht ' + JSON.stringify(u.verwacht) + ', kreeg ' + JSON.stringify(u.werkelijk));
    lijst.appendChild(li);
  });
  window.TESTUITSLAG = { goed: goed, totaal: uitslag.length, mislukt: uitslag.filter(function (u) { return !u.ok; }) };
})();
</script>
