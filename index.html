<script src="schermen.js"></script>
<script>
// Service worker (offline). Neemt een nieuwe versie het over, dan één keer
// herladen zodat alle bestanden van dezelfde versie zijn — niet als er net
// iets ingetypt wordt (dan de volgende keer openen).
if ('serviceWorker' in navigator) {
  var hadVersie = !!navigator.serviceWorker.controller, herladen = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    var bezig = [].some.call(document.querySelectorAll('input'), function (i) { return i.value; });
    if (hadVersie && !herladen && !bezig) { herladen = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js').catch(function () { /* zonder offline verder */ });
}
</script>
</body>
